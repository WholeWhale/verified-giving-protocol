name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No dependencies to install. The validator and the test suite are
      # deliberately stdlib-only so a nonprofit can run them without a toolchain.
      - name: Run the VGP test suite
        run: python tests/run_tests.py
