name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No dependencies to install. The validator and the test suite are
      # deliberately stdlib-only so a nonprofit can run them without a toolchain.
      - name: Run the VGP test suite
        run: python tests/run_tests.py

      # The site's URL-fetch endpoint takes a URL from the public, so its SSRF
      # guards are pinned by tests. They regress silently otherwise.
      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Run the site guard tests
        working-directory: site
        run: npm test

      - name: Build the site
        working-directory: site
        run: npm run build
